<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bacon Ipsum Caesar Cipher</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>
  <h1>Encryption with Bacon Ipsum</h1>
  
  <div class="flex-container">
    <!-- Cell 1: Form -->
    <div class="cell">
      <h2>Form to encrypt meat</h2>
        <form id ="meatForm">
            <label for="meatChoice">Filler or No Filler</label>
            <select id="fillerInput" name="fillerInput">
                <option value="meat-and-filler">Filler</option>
                <option value="all-meat">No Filler</option>
            </select>
            <br><br>

            <label for="wordInput">How much meat:</label>
            <select id = "meatInput" name = "meatInput">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
            <br><br>

            <label for="algoChoice">Select algorithm for encryption</label>
            <select id="algoInput" name="algoInput">
                <option value="Algo1">Algo1</option>
                <option value="Algo2">Algo2</option>
            </select>
            <br><br>

          <input type="button" value="Fetch the meat" onclick="fetchMeat()">
        </form>
    </div>

    <!-- Cell 2: Para 1 -->
    <div class="cell">
      <h2>Raw JSON</h2>
        <p id = "rawMeat">
        </p>
    </div>

    <!-- Cell 3: Para 2 -->
    <div class="cell">
      <h2>Paragraph Format</h2>
        <p id = "formattedMeat"> 
        </p>
    </div>

    <!-- Cell 4: Para 3 -->
    <div class="cell">
      <h2>1st Encryption Algo</h2>
        <p id = "algo1">
        </p>
    </div>

    <!-- Cell 5: Para 4 -->
    <div class="cell">
      <h2>2nd Encryption Algo</h2>
        <p id = "algo2"> 
        </p>
    </div>

</body>
</html>
