<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch Out</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <!-- Top bar: logo (left) + icons/links (right) -->
  <header class="top-bar flex" role="banner">
    <div class="logo cell" id="site-logo">
      <h1>
        <a href="https://www.coolmathgames.com/" target="_blank" rel="noopener noreferrer" class="btn-link">Watch Out</a>
      </h1>
    </div>

    <nav class="top-actions cell" role="navigation" aria-label="Top navigation">
      <a href="https://github.com/man-NY4" target="_blank" rel="noopener noreferrer" class="nav-link btn-link">
        <i class="fas fa-th-large"></i> Catalog
      </a>
      <a href="https://gist.github.com/MattIPv4/045239bc27b16b2bcf7a3a9a4648c08a" target="_blank" rel="noopener noreferrer" class="nav-link btn-link">
        <i class="fas fa-user"></i> Login
      </a>
      <a href="https://www.google.com/imgres?q=basket&imgurl=https%3A%2F%2Fm.media-amazon.com%2Fimages%2FI%2F81S0GGu94oL.jpg&imgrefurl=https%3A%2F%2Fwww.amazon.com%2FWald-Imports-Willow-Decorative-Storage%2Fdp%2FB00JV2KIT6" target="_blank" rel="noopener noreferrer" class="nav-link btn-link">
        <i class="fas fa-shopping-basket"></i> Basket
      </a>
    </nav>
  </header>

  <!-- Main content area: 4 cells -->
  <main class="content-area flex" role="main">
    <section class="tagline cell" aria-label="Store tagline">
      <h2>The Time is Now</h2>
      <a href="https://en.wikipedia.org/wiki/Time" target="_blank" rel="noopener noreferrer" class="img-link">
        <img src="https://thumbs.dreamstime.com/b/worrier-man-running-out-time-looking-his-watch-isolated-white-background-48067264.jpg" 
             alt="Tagline promotional banner" class="responsive-media">
      </a>
    </section>

    <section class="todays-pick cell" aria-label="Today's pick">
      <h3>Today's Pick</h3>
      <a href="https://allwatches.org/en/nickelodeon-spongebob-squarepants-yellow-childrens-casual-strap-watch-sb39b-p102997/" target="_blank" rel="noopener noreferrer" class="img-link">
        <img src="https://i.pinimg.com/474x/40/da/9f/40da9f5cf39cec67b21aa353f7d86e3f.jpg" 
             alt="Today's featured watch" class="responsive-media">
      </a>
    </section>

    <section class="recent-arrival cell" aria-label="Recent arrival">
      <h3>Recent Arrival</h3>
      <a href="https://us.mrjoneswatches.com/collections/unusual-watches/products/beam-me-up" target="_blank" rel="noopener noreferrer" class="img-link">
        <img src="https://us.mrjoneswatches.com/cdn/shop/files/Beam-me-up-menu.jpg?v=1756456294&width=1800" 
             alt="Newly arrived watch" class="responsive-media">
      </a>
    </section>

    <section class="special-deal cell" aria-label="Special deal">
      <h3>Special Deal</h3>
      <a href="https://www.exquisitetimepieces.com/jacob-co-astronomia-casino-rose-gold-baguette-at860-40-bd-bd-a.html?srsltid=AfmBOopqD1U9JvN_ihCLUMzIlfpQ18ZYgHlXXwvF8kprhGpI3TABruWp7N4" target="_blank" rel="noopener noreferrer" class="img-link">
        <img src="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcR7kfeO4mVgxIzIdpEi7lRaGaLCjPewX1vPGLecnxsIgCHH5lSr9zTA5ghm0RpbBXdzzZ0QzJDvgOV4H5rMoPgoDMsO_-hnQ-i7nVcSY-hfjXjCNYBvSjZGeoM" 
             alt="Special deal watch" class="responsive-media">
      </a>
    </section>
  </main>

  <!-- Bottom bar: contact + map placeholder -->
  <footer class="bottom-bar flex" role="contentinfo">
    <div class="contact cell" aria-label="Contact information">
      <h4>Contact</h4>
      <p>123 This is a Street, Imagination, ZZ</p>
      <a href="https://mkgamesdev.github.io/MKGBA2.0/launcher.html#digimon_racing" target="_blank" rel="noopener noreferrer" class="contact-link btn-link">Email us</a>
    </div>

    <div class="map cell" aria-label="Store location map">
      <h4>Store Location</h4>
      <div class="map-placeholder">Map placeholder — Imagination, USA</div>
      <a href="https://example.com" target="_blank" rel="noopener noreferrer" class="btn-link">View on map</a>
    </div>
  </footer>

</body>
</html>
