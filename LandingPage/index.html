<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch Out</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top bar: logo (left) + icons/links (right) -->
  <header class="top-bar flex" role="banner">
    <div class="logo cell" id="site-logo">
      <h1>Watch Out</h1>
    </div>

    <nav class="top-actions cell" role="navigation" aria-label="Top navigation">
      <!-- placeholders for links/icons -->
      <a href="#" class="nav-link">Catalog</a>
      <a href="#" class="nav-link">Login</a>
      <a href="#" class="nav-link">Basket</a>
    </nav>
  </header>

  <!-- Main content area: 4 cells -->
  <main class="content-area flex" role="main">
    <section class="tagline cell" aria-label="Store tagline">
      <h2>The Time is Now</h2>
      <p class="placeholder-note">[It's Time]</p>
    </section>

    <section class="todays-pick cell" aria-label="Today's pick">
      <h3>Today's Pick</h3>
      <p class="placeholder-note">[Image/video placeholder]</p>
    </section>

    <section class="recent-arrival cell" aria-label="Recent arrival">
      <h3>Recent Arrival</h3>
      <p class="placeholder-note">[Image/video placeholder]</p>
    </section>

    <section class="special-deal cell" aria-label="Special deal">
      <h3>Special Deal</h3>
      <p class="placeholder-note">[Image/video placeholder]</p>
    </section>
  </main>

  <!-- Bottom bar: contact + map placeholder -->
  <footer class="bottom-bar flex" role="contentinfo">
    <div class="contact cell" aria-label="Contact information">
      <h4>Contact</h4>
      <p>123 This is a Street, Imagination, ZZ</p>
      <a href="#" class="contact-link">Email us</a>
    </div>

    <div class="map cell" aria-label="Store location map">
      <h4>Store Location</h4>
      <div class="map-placeholder">Map placeholder — Imagination, USA</div>
    </div>
  </footer>

</body>
</html>
