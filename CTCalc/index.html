<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Tendency Calc</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>
  <h1>Central Tendency Calc</h1>
  
  <div class="flex-container">
    <!-- Cell 1: Form -->
    <div class="cell">
      <h2>Form to get number</h2>
        <form id ="calcForm">
            <label for="begRange">Enter beginning range:</label>
            <input type="text" id="begRange" name="begRange" required>
            <br><br>

            <label for="endRange">Enter ending range:</label>
            <input type="text" id="endRange" name="endRange" required>
            <br><br>

            <label for="numInput">Enter a number in the range:</label>
            <input type="text" id="numInput" name="numInput" required>
            <br><br>

          <input type="button" value="Add the number" onclick="fetchNum()">
        </form>
    </div>

    <!-- Cell 2: Para 1 -->
    <div class="cell">
      <h2>Numbers</h2>
        <p id = "numPara">
        </p>
    </div>

    <!-- Cell 3: Para 2 -->
    <div class="cell">
      <h2>Central Tendencies</h2>
        <p id = "meanNum">Mean:</p>
        <p id = "medianNum">Median:</p>
        <p id = "modeNum">Mode:</p>
    </div>

</body>
</html>
