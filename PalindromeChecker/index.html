<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Builder</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>
  <h1>List Builder</h1>
  
  <div class="flex-container">
    <!-- Cell 1: Form -->
    <div class="cell">
      <h2>Form to get a word and put in lists</h2>
        <form id ="wordForm">
          <label for="wordInput">Enter a word:</label>
          <input type="text" id="wordInput" name="wordInput" required>
          <br><br>
          
          <input type="radio" id="list1" name="listChoice" value="list1" checked>
          <label for="list1">List 1</label>
          <input type="radio" id="list2" name="listChoice" value="list2">
          <label for="list2">List 2</label>
          <br><br>
          
          <input type="button" value="Add to List" onclick="addItemToList()">
        </form>
    </div>

    <!-- Cell 2: List 1 -->
    <div class="cell">
      <h2>List 1</h2>
        <ul id="list1Items">
          <br><br>
        </ul>
        <input type="button" value="Clear List 1" onclick="clearList('list1Items')">
    </div>

    <!-- Cell 3: List 2 -->
    <div class="cell">
      <h2>List 2</h2>
        <ul id="list2Items">
          <br><br>
        </ul>
        <input type="button" value="Clear List 2" onclick="clearList('list2Items')">
    </div>
</body>
</html>
