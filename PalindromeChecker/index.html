<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindrome Checker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>
  <h1>Palindrome Checker</h1>
  
  <div class="flex-container">
    <!-- Cell 1: Form -->
    <div class="cell">
      <h2>Form to get a word and check if Palindrome</h2>
        <form id ="wordForm">
          <label for="wordInput">Enter a word:</label>
          <input type="text" id="wordInput" name="wordInput" required>
          <br><br>
          
            <input type="radio" id="list1" name="listChoice" value="list1" checked>
            <label for="list1">Algorithm 1</label>
            <br>
            <input type="radio" id="list2" name="listChoice" value="list2">
            <label for="list2">Algorithm 2</label>
            <input type="radio" id="list3" name="listChoice" value="list3">
            <label for="list3">Algorithm 3</label>
          <br><br>
          
          <input type="button" value="Check and add to List" onclick="addItemToList()">
        </form>
    </div>

    <!-- Cell 2: List 1 -->
    <div class="cell">
      <h2>Algorithm 1</h2>
        <ul id="list1Items">
          <br><br>
        </ul>
        <input type="button" value="Clear List 1" onclick="clearList('list1Items')">
    </div>

    <!-- Cell 3: List 2 -->
    <div class="cell">
      <h2>Algorithm 2</h2>
        <ul id="list2Items">
          <br><br>
        </ul>
        <input type="button" value="Clear List 2" onclick="clearList('list2Items')">
    </div>

    <!-- Cell 4: List 3 -->
    <div class="cell">
      <h2>Algorithm 3</h2>
        <ul id="list3Items">
          <br><br>
        </ul>
        <input type="button" value="Clear List 3" onclick="clearList('list3Items')">
    </div>
</body>
</html>
