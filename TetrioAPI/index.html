<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capstone Project</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js"></script>
</head>
<body>
  <h1>Tetrio API Frontend</h1>
  
  <div class="flex-container">

    <!-- Cell 1: Leaderboard Form -->
    <div class="cell">
      <h2>Leaderboard Form</h2>
        <form id ="tetrioForm">

            <label for="wordInput">Choose leaderboard:</label>
            <select id = "leaderboard" name = "leaderboard">
                <option value="league">TETRA LEAGUE</option>
                <option value="xp">XP</option>
                <option value="ar">Achievement Rating</option>
            </select>
            <br><br>

          <input type="button" value="Fetch the leaderboard" onclick="fetchTETRIO()">
        </form>
    </div>

    <!-- Cell 2: Leaderboard -->
    <div class="cell">
      <h2>Leaderboard</h2>
        <p id = "leaderboardPara">
        </p>
    </div>

    <!-- Cell 3: User Summary Form -->
    <div class="cell">
      <h2>User Summary Form</h2>
        <form id ="userForm">

            <label for="wordInput">Enter Tetrio username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>

            <label for="wordInput">Choose summary to display:</label>
            <select id = "summaryType" name = "summaryType">
                <option value="40l">40 Lines</option>
                <option value="blitz">Blitz</option>
                <option value="zenith">Quickplay</option>
            </select>
            <br><br>

          <input type="button" value="Fetch user info" onclick="fetchUser()">
        </form>
    </div>
    
    <!-- Cell 4: User Summary -->
    <div class="cell">
      <h2>User Summary</h2>
        <p id = "userPara">
        </p>
    </div>

  </div>

</body>
</html>
